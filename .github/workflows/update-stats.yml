name: Update profile stats

on:
  schedule:
    - cron: "17 8 * * *" # once a day
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide_border=true&theme=transparent
          path: profile/stats.svg
          token: ${{ secrets.STATS_PAT }}
          fail_on_error: "true"

      # postgresql-17.4-optimized is left out because upstream PostgreSQL's C code
      # would otherwise dwarf every other language on the card.
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&exclude_repo=postgresql-17.4-optimized&size_weight=0.5&count_weight=0.5&hide_border=true&theme=transparent
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_PAT }}
          fail_on_error: "true"

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update profile stats" || exit 0
          git push
